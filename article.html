<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artykuł — CyberProjects</title>

    <meta name="theme-color" content="#111c2b" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo_strony.png" />
    <link rel="shortcut icon" type="image/png" href="/assets/logo_strony.png" />
    <link rel="apple-touch-icon" href="/assets/logo_strony.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-1: #0d1523;
            --bg-2: #121c2d;
            --bg-3: #18263a;
            --bg-4: #22354e;
            --text: #f5f8fc;
            --muted: rgba(245, 248, 252, 0.82);
            --muted-2: rgba(245, 248, 252, 0.56);
            --accent-1: #6ea8f2;
            --accent-2: #93f0dc;
            --accent-3: #b6ccff;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            --shadow-2: 0 14px 40px rgba(110, 168, 242, 0.18);
            --radius: 28px;
            --maxw: 1120px;
            --nav-h: 72px;
            --glass: rgba(15, 22, 35, 0.62);
            --glass-2: rgba(18, 28, 45, 0.72);
            --line: rgba(255, 255, 255, 0.085);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            line-height: 1.7;
            background:
                radial-gradient(900px 620px at 12% 8%, rgba(110, 168, 242, 0.24), transparent 55%),
                radial-gradient(780px 500px at 88% 4%, rgba(147, 240, 220, 0.12), transparent 50%),
                radial-gradient(700px 500px at 85% 78%, rgba(182, 204, 255, 0.08), transparent 54%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2) 34%, var(--bg-3) 72%, var(--bg-4));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
            background-size: 110px 110px;
            opacity: 0.14;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 20%, transparent 80%, rgba(0,0,0,0.1));
            z-index: 0;
        }

        a { color: inherit; text-decoration: none; }
        img, video { max-width: 100%; display: block; }

        .wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 0;
        }

        nav {
            height: var(--nav-h);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 18px;
            background: rgba(10, 16, 26, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 12px 26px rgba(110, 168, 242, 0.18);
            flex: 0 0 auto;
        }

        .logo img {
            width: 110%;
            height: 110%;
            object-fit: cover;
        }

        .site-title {
            min-width: 0;
            font-weight: 800;
            line-height: 1.1;
            display: flex;
            flex-direction: column;
        }

        .site-title small.site-subtitle {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            white-space: nowrap;
            flex-wrap: nowrap;
            font-size: clamp(10px, 2.6vw, 12px);
            line-height: 1;
            margin-top: 4px;
            color: var(--muted);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 16px;
            font-weight: 750;
            border: 1px solid transparent;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-back {
            background: linear-gradient(135deg, #6ea8f2, #93d8ff);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 24px rgba(110, 168, 242, 0.24);
            animation: backPulse 2.4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .btn-back::after {
            content: "↩";
            margin-left: 10px;
            font-size: 1rem;
            transition: transform 0.18s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 14px 30px rgba(110, 168, 242, 0.32);
            filter: brightness(1.06);
        }

        .btn-back:hover::after { transform: translateX(-2px); }

        @keyframes backPulse {
            0%, 100% {
                box-shadow: 0 10px 24px rgba(110, 168, 242, 0.22);
                filter: brightness(1);
            }
            50% {
                box-shadow: 0 12px 28px rgba(110, 168, 242, 0.34);
                filter: brightness(1.06);
            }
        }

        main {
            padding: 28px 0 60px;
            position: relative;
            z-index: 1;
        }

        .article-shell {
            border-radius: 34px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.035)),
                rgba(7, 12, 20, 0.32);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.26);
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
            gap: 0;
            align-items: stretch;
        }

        .hero-copy {
            padding: 34px;
            border-right: 1px solid rgba(255,255,255,0.08);
            background:
                radial-gradient(700px 320px at 14% 0%, rgba(110,168,242,0.10), transparent 58%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 26%);
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--muted-2);
            font-size: 0.9rem;
            font-weight: 650;
            flex-wrap: wrap;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 0 6px rgba(147, 240, 220, 0.08);
            flex: 0 0 auto;
        }

        h1 {
            margin: 14px 0 12px;
            font-size: clamp(2rem, 4vw, 3.75rem);
            line-height: 1.02;
            letter-spacing: -0.06em;
        }

        .lead {
            margin: 0;
            color: var(--muted);
            max-width: 72ch;
            font-size: 1.02rem;
        }

        .hero-image {
            position: relative;
            min-height: 100%;
            background:
                radial-gradient(520px 280px at 50% 10%, rgba(147,240,220,0.16), transparent 58%),
                #09111b;
            isolation: isolate;
        }

        .hero-image::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(9,17,28,0) 0%, rgba(9,17,28,0.12) 100%),
                radial-gradient(circle at 50% 10%, rgba(255,255,255,0.08), transparent 38%);
            z-index: 1;
            pointer-events: none;
        }

        .hero-image::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 0 0 1px rgba(255,255,255,0.02),
                0 22px 50px rgba(0,0,0,0.30);
            z-index: 2;
            pointer-events: none;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 16 / 12;
            filter: saturate(1.09) contrast(1.05) brightness(0.98);
            transform: scale(1.015);
        }

        .content {
            padding: 0 34px 34px;
        }

        .content p {
            margin: 0 0 16px;
            color: var(--muted);
            text-align: justify;
            hyphens: auto;
            text-wrap: pretty;
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 1.18rem;
            letter-spacing: -0.03em;
        }

        .media-wrap {
            padding: 0 34px 34px;
            display: grid;
            gap: 18px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
            margin: 6px 0 0;
        }

        .empty-state {
            color: var(--muted-2);
            padding: 2px 0 0;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .media-card {
            margin: 0;
            border-radius: 24px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025)),
                rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 16px 36px rgba(0,0,0,0.16);
        }

        .media-card--clickable {
            cursor: pointer;
            padding: 0;
            width: 100%;
            appearance: none;
            text-align: left;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
            position: relative;
        }

        .media-card--clickable:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.14);
            box-shadow: 0 22px 48px rgba(0,0,0,0.24);
            filter: brightness(1.04);
        }

        .media-card--clickable::after {
            content: "🔍 Powiększ";
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 7px 10px;
            font-size: 0.78rem;
            line-height: 1;
            color: #fff;
            background: rgba(10, 16, 26, 0.58);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2;
            box-shadow: 0 8px 18px rgba(0,0,0,0.14);
        }

        .media-media,
        .media-card img,
        .media-card video {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: #0b1522;
        }

        .media-card figcaption {
            padding: 12px 14px 13px;
            color: var(--muted);
            font-size: 0.94rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .error-box {
            padding: 28px;
            color: var(--muted);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(4, 8, 14, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .modal.is-open {
            display: flex;
        }

        .modal-panel {
            width: min(1180px, 100%);
            max-height: 100%;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        .modal-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(15, 22, 35, 0.72);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 18px 50px rgba(0,0,0,0.28);
        }

        .modal-title {
            min-width: 0;
            font-weight: 700;
            color: rgba(245,248,252,0.92);
            font-size: 0.95rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .modal-btn {
            min-height: 42px;
            padding: 0 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .modal-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.14);
        }

        .modal-view {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background:
                radial-gradient(800px 500px at 50% 0%, rgba(110,168,242,0.10), transparent 58%),
                rgba(10, 16, 25, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 90px rgba(0,0,0,0.55);
            min-height: 0;
            display: grid;
            place-items: center;
        }

        .modal-view img {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 130px);
            object-fit: contain;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
        }

        .modal-caption {
            padding: 12px 16px 16px;
            color: var(--muted);
            font-size: 0.94rem;
            text-align: center;
        }

        .empty-caption {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.18s ease-out both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 980px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-copy {
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }

            .hero-image {
                min-height: 260px;
            }
        }

        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            nav { border-radius: 24px; padding: 0 14px; height: 64px; gap: 10px; }
            .logo { width: 40px; height: 40px; border-radius: 14px; }
            .site-title { font-size: 14px; min-width: 0; }
            .site-title small.site-subtitle {
                font-size: clamp(9px, 2.3vw, 11px);
                letter-spacing: -0.01em;
            }
            main { padding-top: 20px; }
            .hero-copy, .content, .media-wrap { padding-left: 18px; padding-right: 18px; }
            .media-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.15rem; }
            .hero-image { min-height: 240px; }
            .hero-image img { aspect-ratio: 16 / 10; }

            .media-card--clickable::after {
                content: "🔍";
                padding: 7px 9px;
            }

            .modal {
                padding: 10px;
            }

            .modal-view img {
                max-height: calc(100vh - 170px);
            }

            .modal-topbar {
                padding: 10px 12px;
                border-radius: 16px;
            }

            .modal-actions {
                gap: 8px;
            }

            .modal-btn {
                min-height: 40px;
                padding: 0 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <nav class="glass">
                <div class="brand">
                    <div class="logo">
                        <img src="/assets/logo_strony.png" alt="Logo CyberProjects" />
                    </div>
                    <div class="site-title">
                        CyberProjects
                        <small class="site-subtitle">
                            <span>•</span>
                            <span>Sebastian Dziewit</span>
                            <span>•</span>
                        </small>
                    </div>
                </div>

                <a class="btn btn-back" href="javascript:history.back()">Powrót</a>
            </nav>
        </div>
    </div>

    <main>
        <div class="wrap">
            <article class="article-shell" id="articleRoot">
                <div class="error-box">Ładowanie artykułu...</div>
            </article>
        </div>
    </main>

    <div class="modal" id="imageModal" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia">
            <div class="modal-topbar">
                <div class="modal-title" id="modalTitle">Podgląd zdjęcia</div>
                <div class="modal-actions">
                    <button class="modal-btn" id="backToArticleBtn" type="button">Wróć do artykułu</button>
                    <button class="modal-btn" id="closeModalBtn" type="button" aria-label="Zamknij podgląd">Zamknij</button>
                </div>
            </div>
            <div class="modal-view">
                <img id="modalImage" src="" alt="" />
            </div>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatTextToHtml(text) {
            if (!text) return `<p>Brak treści artykułu.</p>`;
            const clean = String(text).replace(/\r/g, "").trim();
            const paragraphs = clean.split(/\n\s*\n+/).map((p) => p.trim()).filter(Boolean);
            return paragraphs.map((p) => `<p>${escapeHtml(p).replace(/\n/g, "<br>")}</p>`).join("");
        }

        function mediaFigureHtml(media, kind) {
            if (!media || !media.src) return "";
            const title = media.title ? escapeHtml(media.title) : "";
            const alt = title || "Grafika artykułu";

            if (kind === "video") {
                return `
                    <figure class="media-card">
                        <video controls preload="metadata">
                            <source src="${escapeHtml(media.src)}" type="video/mp4">
                            Twoja przeglądarka nie obsługuje odtwarzania wideo.
                        </video>
                        ${title ? `<figcaption>${title}</figcaption>` : ""}
                    </figure>
                `;
            }

            return `
                <button
                    type="button"
                    class="media-card media-card--clickable"
                    data-full="${escapeHtml(media.src)}"
                    data-title="${alt}"
                    data-caption="${title}"
                    aria-label="Otwórz zdjęcie w pełnym rozmiarze: ${alt}"
                >
                    <img src="${escapeHtml(media.src)}" alt="${alt}" loading="lazy" decoding="async">
                    ${title ? `<figcaption>${title}</figcaption>` : ""}
                </button>
            `;
        }

        function takeMax(items, maxCount) {
            return Array.isArray(items) ? items.slice(0, maxCount) : [];
        }

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        const modalTitle = document.getElementById("modalTitle");
        const modalCaption = document.getElementById("modalCaption");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const backToArticleBtn = document.getElementById("backToArticleBtn");
        let lastFocusedElement = null;

        function openModal(src, title, caption) {
            lastFocusedElement = document.activeElement;

            modalImg.src = src;
            modalImg.alt = title || "Powiększony obraz";
            modalTitle.textContent = title || "Podgląd zdjęcia";
            modalCaption.textContent = caption || "";

            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");

            closeModalBtn.focus();
        }

        function closeModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");

            modalImg.src = "";
            modalImg.alt = "";
            modalTitle.textContent = "Podgląd zdjęcia";
            modalCaption.textContent = "";

            if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
                lastFocusedElement.focus();
            }
        }

        closeModalBtn.addEventListener("click", closeModal);
        backToArticleBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("is-open")) {
                closeModal();
            }
        });

        async function loadArticle() {
            const root = document.getElementById("articleRoot");
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            try {
                const res = await fetch("articles.json", { cache: "no-store" });
                if (!res.ok) throw new Error("Nie znaleziono articles.json");

                const articles = await res.json();
                if (!Array.isArray(articles) || articles.length === 0) {
                    root.innerHTML = `<div class="error-box">Brak artykułów w pliku articles.json.</div>`;
                    return;
                }

                const article = articles.find((a, index) => String(a.id || index + 1) === String(id));
                if (!article) {
                    root.innerHTML = `<div class="error-box">Nie znaleziono artykułu o podanym identyfikatorze.</div>`;
                    return;
                }

                document.title = `${article.title || "Artykuł"} — CyberProjects`;

                let fullText = article.content || "";
                if (!fullText && article.text) {
                    const txtRes = await fetch(article.text, { cache: "no-store" });
                    if (txtRes.ok) fullText = await txtRes.text();
                }

                // ZMIANA: 8 grafik i 4 filmiki
                const images = takeMax(article.images, 8);
                const videos = takeMax(article.videos, 4);

                const imageHtml = images.map((img) => mediaFigureHtml(img, "image")).join("");
                const videoHtml = videos.map((vid) => mediaFigureHtml(vid, "video")).join("");

                const mediaBlock = (imageHtml || videoHtml)
                    ? `
                        <div class="media-wrap">
                            <div class="divider"></div>
                            <h2 class="section-title">Materiały dodatkowe</h2>
                            ${imageHtml ? `<div class="media-grid">${imageHtml}</div>` : ""}
                            ${videoHtml ? `<div class="media-grid">${videoHtml}</div>` : ""}
                        </div>
                    `
                    : `
                        <div class="media-wrap">
                            <div class="divider"></div>
                            <div class="empty-state">Brak przypisanych grafik lub filmów.</div>
                        </div>
                    `;

                const cover = article.cover || (images[0] && images[0].src) || "";
                const coverTitle = article.title || "Artykuł";

                root.innerHTML = `
                    <div class="hero">
                        <div class="hero-copy">
                            <div class="kicker">
                                <span class="dot"></span>
                                <span>${escapeHtml(article.date || "Artykuł")}</span>
                                <span>•</span>
                                <span>${escapeHtml(article.category || "Technologia / Embedded")}</span>
                            </div>

                            <h1>${escapeHtml(coverTitle)}</h1>

                            ${article.lead ? `<p class="lead">${escapeHtml(article.lead)}</p>` : ""}
                        </div>

                        <div class="hero-image">
                            ${
                                cover
                                    ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(coverTitle)}" loading="eager" decoding="async">`
                                    : ""
                            }
                        </div>
                    </div>

                    <div class="content">
                        ${formatTextToHtml(fullText)}
                    </div>

                    ${mediaBlock}
                `;

                root.querySelectorAll(".media-card--clickable").forEach((card) => {
                    card.addEventListener("click", () => {
                        openModal(
                            card.getAttribute("data-full") || "",
                            card.getAttribute("data-title") || "Podgląd zdjęcia",
                            card.getAttribute("data-caption") || ""
                        );
                    });
                });
            } catch (err) {
                console.error(err);
                root.innerHTML = `
                    <div class="error-box">
                        <strong>Nie udało się wczytać artykułu.</strong><br>
                        Sprawdź plik <code>articles.json</code> oraz ścieżki do plików w folderze <code>articles/</code>.
                    </div>
                `;
            }
        }

        loadArticle();
    </script>
</body>
</html>
