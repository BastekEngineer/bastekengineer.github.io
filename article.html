<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artykuł — CyberProjects</title>

    <meta name="theme-color" content="#111c2b" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo_strony.png" />
    <link rel="shortcut icon" type="image/png" href="/assets/logo_strony.png" />
    <link rel="apple-touch-icon" href="/assets/logo_strony.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-1: #121c2d;
            --bg-2: #18263a;
            --bg-3: #20324a;
            --bg-4: #27405d;
            --text: #f5f8fc;
            --muted: rgba(245, 248, 252, 0.82);
            --muted-2: rgba(245, 248, 252, 0.56);
            --accent-3: #6ea8f2;
            --accent-4: #93f0dc;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
            --radius: 24px;
            --maxw: 1120px;
            --nav-h: 72px;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            line-height: 1.65;
            background:
                radial-gradient(760px 520px at 14% 10%, rgba(140, 200, 255, 0.22), transparent 52%),
                radial-gradient(640px 420px at 86% 8%, rgba(147, 240, 220, 0.11), transparent 50%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2) 42%, var(--bg-3) 74%, var(--bg-4));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
            background-size: 112px 112px;
            opacity: 0.12;
            z-index: 0;
        }

        a { color: inherit; text-decoration: none; }
        img, video { max-width: 100%; display: block; }

        .wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: rgba(17, 26, 40, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 0;
        }

        nav {
            height: var(--nav-h);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 18px;
            background: rgba(12, 19, 30, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-3), var(--accent-4));
            flex: 0 0 auto;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .site-title {
            min-width: 0;
            font-weight: 800;
            line-height: 1.1;
        }

        .site-title small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-weight: 500;
            font-size: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 16px;
            font-weight: 750;
            border: 1px solid transparent;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-back {
            background: linear-gradient(135deg, #6ea8f2, #93d8ff);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 24px rgba(110, 168, 242, 0.22);
            animation: backPulse 2.4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .btn-back::after {
            content: "↩";
            margin-left: 10px;
            font-size: 1rem;
            transition: transform 0.18s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 14px 30px rgba(110, 168, 242, 0.32);
            filter: brightness(1.06);
        }

        .btn-back:hover::after {
            transform: translateX(-2px);
        }

        @keyframes backPulse {
            0%, 100% {
                box-shadow: 0 10px 24px rgba(110, 168, 242, 0.22);
                filter: brightness(1);
            }
            50% {
                box-shadow: 0 12px 28px rgba(110, 168, 242, 0.34);
                filter: brightness(1.06);
            }
        }

        main {
            padding: 28px 0 60px;
            position: relative;
            z-index: 1;
        }

        .article-shell {
            border-radius: 30px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: var(--shadow);
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
            gap: 0;
        }

        .hero-copy {
            padding: 30px;
            border-right: 1px solid rgba(255,255,255,0.08);
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--muted-2);
            font-size: 0.9rem;
            font-weight: 650;
            flex-wrap: wrap;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-4);
            flex: 0 0 auto;
        }

        h1 {
            margin: 12px 0 10px;
            font-size: clamp(2rem, 4vw, 3.6rem);
            line-height: 1.02;
            letter-spacing: -0.055em;
        }

        .lead {
            margin: 0;
            color: var(--muted);
            max-width: 70ch;
        }

        .hero-image {
            position: relative;
            min-height: 100%;
            background: #0b1522;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 16 / 12;
        }

        .content {
            padding: 0 30px 30px;
        }

        .content-card {
            margin-top: 0;
            padding: 0;
        }

        .content p {
            margin: 0 0 16px;
            color: var(--muted);
            text-align: justify;
            hyphens: auto;
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 1.18rem;
            letter-spacing: -0.03em;
        }

        .media-wrap {
            padding: 0 30px 30px;
            display: grid;
            gap: 18px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .media-card {
            margin: 0;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .media-card img,
        .media-card video {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: #0b1522;
        }

        .media-card figcaption {
            padding: 12px 14px;
            color: var(--muted);
            font-size: 0.94rem;
        }

        .empty-state {
            color: var(--muted-2);
            padding: 2px 0 0;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
            margin: 6px 0 0;
        }

        .error-box {
            padding: 28px;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-copy {
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }
        }

        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            nav { border-radius: 24px; padding: 0 14px; height: 64px; }
            .logo { width: 40px; height: 40px; border-radius: 14px; }
            .site-title { font-size: 14px; }
            main { padding-top: 20px; }
            .hero-copy, .content, .media-wrap { padding-left: 18px; padding-right: 18px; }
            .media-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.15rem; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <nav class="glass">
                <div class="brand">
                    <div class="logo">
                        <img src="/assets/logo_strony.png" alt="Logo CyberProjects" />
                    </div>
                    <div class="site-title">
                        CyberProjects
                        <small> • Sebastian Dziewit • </small>
                    </div>
                </div>

                <a class="btn btn-back" href="javascript:history.back()">Powrót</a>
            </nav>
        </div>
    </div>

    <main>
        <div class="wrap">
            <article class="article-shell" id="articleRoot">
                <div class="error-box">Ładowanie artykułu...</div>
            </article>
        </div>
    </main>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatTextToHtml(text) {
            if (!text) return `<p>Brak treści artykułu.</p>`;
            const clean = String(text).replace(/\r/g, "").trim();
            const paragraphs = clean.split(/\n\s*\n+/).map((p) => p.trim()).filter(Boolean);
            return paragraphs.map((p) => `<p>${escapeHtml(p).replace(/\n/g, "<br>")}</p>`).join("");
        }

        function mediaFigureHtml(media, kind) {
            if (!media || !media.src) return "";
            const title = media.title ? escapeHtml(media.title) : "";

            if (kind === "video") {
                return `
                    <figure class="media-card">
                        <video controls preload="metadata">
                            <source src="${escapeHtml(media.src)}" type="video/mp4">
                            Twoja przeglądarka nie obsługuje odtwarzania wideo.
                        </video>
                        ${title ? `<figcaption>${title}</figcaption>` : ""}
                    </figure>
                `;
            }

            return `
                <figure class="media-card">
                    <img src="${escapeHtml(media.src)}" alt="${title || "Grafika artykułu"}" loading="lazy" decoding="async">
                    ${title ? `<figcaption>${title}</figcaption>` : ""}
                </figure>
            `;
        }

        function takeMax(items, maxCount) {
            return Array.isArray(items) ? items.slice(0, maxCount) : [];
        }

        async function loadArticle() {
            const root = document.getElementById("articleRoot");
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            try {
                const res = await fetch("articles.json", { cache: "no-store" });
                if (!res.ok) throw new Error("Nie znaleziono articles.json");

                const articles = await res.json();
                if (!Array.isArray(articles) || articles.length === 0) {
                    root.innerHTML = `<div class="error-box">Brak artykułów w pliku articles.json.</div>`;
                    return;
                }

                const article = articles.find((a, index) => String(a.id || index + 1) === String(id));
                if (!article) {
                    root.innerHTML = `<div class="error-box">Nie znaleziono artykułu o podanym identyfikatorze.</div>`;
                    return;
                }

                document.title = `${article.title || "Artykuł"} — CyberProjects`;

                let fullText = article.content || "";
                if (!fullText && article.text) {
                    const txtRes = await fetch(article.text, { cache: "no-store" });
                    if (txtRes.ok) fullText = await txtRes.text();
                }

                const images = takeMax(article.images, 3);
                const videos = takeMax(article.videos, 2);

                const imageHtml = images.map((img) => mediaFigureHtml(img, "image")).join("");
                const videoHtml = videos.map((vid) => mediaFigureHtml(vid, "video")).join("");

                const mediaBlock = (imageHtml || videoHtml)
                    ? `
                        <div class="media-wrap">
                            <div class="divider"></div>
                            <h2 class="section-title">Materiały dodatkowe</h2>
                            ${imageHtml ? `<div class="media-grid">${imageHtml}</div>` : ""}
                            ${videoHtml ? `<div class="media-grid">${videoHtml}</div>` : ""}
                        </div>
                    `
                    : `
                        <div class="media-wrap">
                            <div class="divider"></div>
                            <div class="empty-state">Brak przypisanych grafik lub filmów.</div>
                        </div>
                    `;

                const cover = article.cover || (images[0] && images[0].src) || "";
                const coverTitle = article.title || "Artykuł";

                root.innerHTML = `
                    <div class="hero">
                        <div class="hero-copy">
                            <div class="kicker">
                                <span class="dot"></span>
                                <span>${escapeHtml(article.date || "Artykuł")}</span>
                                <span>•</span>
                                <span>${escapeHtml(article.category || "Technologia / Embedded")}</span>
                            </div>

                            <h1>${escapeHtml(coverTitle)}</h1>

                            ${article.lead ? `<p class="lead">${escapeHtml(article.lead)}</p>` : ""}
                        </div>

                        <div class="hero-image">
                            ${
                                cover
                                    ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(coverTitle)}" loading="eager" decoding="async">`
                                    : ""
                            }
                        </div>
                    </div>

                    <div class="content">
                        ${formatTextToHtml(fullText)}
                    </div>

                    ${mediaBlock}
                `;
            } catch (err) {
                console.error(err);
                root.innerHTML = `
                    <div class="error-box">
                        <strong>Nie udało się wczytać artykułu.</strong><br>
                        Sprawdź plik <code>articles.json</code> oraz ścieżki do plików w folderze <code>articles/</code>.
                    </div>
                `;
            }
        }

        loadArticle();
    </script>
</body>
</html>
