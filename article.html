<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artykuł — CyberProjects</title>

    <meta name="theme-color" content="#111c2b" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo_strony.png" />
    <link rel="shortcut icon" type="image/png" href="/assets/logo_strony.png" />
    <link rel="apple-touch-icon" href="/assets/logo_strony.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

    <style>
        :root {
            --bg-1: #0d1523;
            --bg-2: #121c2d;
            --bg-3: #18263a;
            --bg-4: #22354e;
            --text: #f5f8fc;
            --muted: rgba(245, 248, 252, 0.82);
            --muted-2: rgba(245, 248, 252, 0.56);
            --accent-1: #6ea8f2;
            --accent-2: #93f0dc;
            --accent-3: #b6ccff;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            --radius: 28px;
            --maxw: 1120px;
            --nav-h: 72px;
            --glass: rgba(15, 22, 35, 0.62);
            --line: rgba(255, 255, 255, 0.085);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            line-height: 1.75;
            background:
                radial-gradient(900px 620px at 12% 8%, rgba(110, 168, 242, 0.24), transparent 55%),
                radial-gradient(780px 500px at 88% 4%, rgba(147, 240, 220, 0.12), transparent 50%),
                radial-gradient(700px 500px at 85% 78%, rgba(182, 204, 255, 0.08), transparent 54%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2) 34%, var(--bg-3) 72%, var(--bg-4));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
            background-size: 110px 110px;
            opacity: 0.14;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 20%, transparent 80%, rgba(0,0,0,0.1));
            z-index: 0;
        }

        a { color: inherit; text-decoration: none; }
        img, video { max-width: 100%; display: block; }

        .wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 0;
        }

        nav {
            height: var(--nav-h);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 18px;
            background: rgba(10, 16, 26, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 12px 26px rgba(110, 168, 242, 0.18);
            flex: 0 0 auto;
        }

        .logo img {
            width: 110%;
            height: 110%;
            object-fit: cover;
        }

        .site-title {
            min-width: 0;
            font-weight: 800;
            line-height: 1.1;
            display: flex;
            flex-direction: column;
        }

        .site-title small.site-subtitle {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            white-space: nowrap;
            font-size: clamp(10px, 2.6vw, 12px);
            line-height: 1;
            margin-top: 4px;
            color: var(--muted);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 16px;
            font-weight: 750;
            border: 1px solid transparent;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-back {
            background: linear-gradient(135deg, #6ea8f2, #93d8ff);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 24px rgba(110, 168, 242, 0.24);
        }

        main {
            padding: 28px 0 60px;
            position: relative;
            z-index: 1;
        }

        .article-shell {
            border-radius: 34px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.035)),
                rgba(7, 12, 20, 0.32);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.26);
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
            gap: 0;
            align-items: stretch;
        }

        .hero-copy {
            padding: 34px;
            border-right: 1px solid rgba(255,255,255,0.08);
            background:
                radial-gradient(700px 320px at 14% 0%, rgba(110,168,242,0.10), transparent 58%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 26%);
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--muted-2);
            font-size: 0.9rem;
            font-weight: 650;
            flex-wrap: wrap;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 0 6px rgba(147, 240, 220, 0.08);
            flex: 0 0 auto;
        }

        h1 {
            margin: 14px 0 12px;
            font-size: clamp(2rem, 4vw, 3.75rem);
            line-height: 1.02;
            letter-spacing: -0.06em;
        }

        .lead {
            margin: 0;
            color: var(--muted);
            max-width: 72ch;
            font-size: 1.02rem;
        }

        .hero-image {
            position: relative;
            min-height: 100%;
            background:
                radial-gradient(520px 280px at 50% 10%, rgba(147,240,220,0.16), transparent 58%),
                #09111b;
            isolation: isolate;
        }

        .hero-image::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(9,17,28,0) 0%, rgba(9,17,28,0.12) 100%),
                radial-gradient(circle at 50% 10%, rgba(255,255,255,0.08), transparent 38%);
            z-index: 1;
            pointer-events: none;
        }

        .hero-image::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 0 0 1px rgba(255,255,255,0.02),
                0 22px 50px rgba(0,0,0,0.30);
            z-index: 2;
            pointer-events: none;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 16 / 12;
            filter: saturate(1.09) contrast(1.05) brightness(0.98);
            transform: scale(1.015);
        }

        .hero-placeholder {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--muted-2);
            text-align: center;
            font-weight: 600;
        }

        .content {
            padding: 0 34px 34px;
        }

        .article-content {
            max-width: 78ch;
            font-size: 1.05rem;
        }

        .article-content p {
            margin: 0 0 18px;
            color: var(--muted);
            text-align: justify;
            text-justify: inter-word;
            hyphens: auto;
            text-wrap: pretty;
        }

        .article-content h2,
        .article-content h3,
        .article-content h4 {
            margin: 28px 0 12px;
            line-height: 1.18;
            letter-spacing: -0.03em;
        }

        .article-content h2 { font-size: 1.55rem; }
        .article-content h3 { font-size: 1.25rem; }
        .article-content h4 { font-size: 1.08rem; }

        .article-content ul,
        .article-content ol {
            margin: 0 0 18px 22px;
            color: var(--muted);
            padding: 0;
        }

        .article-content li {
            margin: 7px 0;
        }

        .article-content blockquote {
            margin: 18px 0;
            padding: 14px 18px;
            border-left: 4px solid var(--accent-2);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: var(--muted);
        }

        .article-content code {
            padding: 0.16em 0.38em;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.95em;
        }

        .article-content pre {
            margin: 18px 0;
            padding: 16px 18px;
            overflow: auto;
            border-radius: 18px;
            background: rgba(6, 10, 16, 0.7);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text);
        }

        .article-content pre code {
            padding: 0;
            border: 0;
            background: transparent;
        }

        .article-content a {
            color: #9cd2ff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .article-content hr {
            border: 0;
            height: 1px;
            margin: 24px 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            overflow: hidden;
            border-radius: 16px;
            display: block;
        }

        .article-content th,
        .article-content td {
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 12px;
            color: var(--muted);
            vertical-align: top;
        }

        .article-content th {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 18px;
            margin: 10px 0 18px;
        }

        .media-wrap {
            padding: 0 34px 34px;
            display: grid;
            gap: 18px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
            margin: 6px 0 0;
        }

        .empty-state {
            color: var(--muted-2);
            padding: 2px 0 0;
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 1.18rem;
            letter-spacing: -0.03em;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .media-card {
            margin: 0;
            border-radius: 24px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025)),
                rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 16px 36px rgba(0,0,0,0.16);
        }

        .media-card--clickable {
            cursor: pointer;
            padding: 0;
            width: 100%;
            appearance: none;
            text-align: left;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
            position: relative;
        }

        .media-card--clickable:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.14);
            box-shadow: 0 22px 48px rgba(0,0,0,0.24);
            filter: brightness(1.04);
        }

        .media-card--clickable::after {
            content: "🔍 Powiększ";
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 7px 10px;
            font-size: 0.78rem;
            line-height: 1;
            color: #fff;
            background: rgba(10, 16, 26, 0.58);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2;
            box-shadow: 0 8px 18px rgba(0,0,0,0.14);
        }

        .media-card img,
        .media-card video {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: #0b1522;
        }

        .media-card figcaption {
            padding: 12px 14px 13px;
            color: var(--muted);
            font-size: 0.94rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .error-box {
            padding: 28px;
            color: var(--muted);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(4, 8, 14, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .modal.is-open {
            display: flex;
        }

        .modal-panel {
            width: min(1180px, 100%);
            max-height: 100%;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        .modal-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(15, 22, 35, 0.72);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 18px 50px rgba(0,0,0,0.28);
        }

        .modal-title {
            min-width: 0;
            font-weight: 700;
            color: rgba(245,248,252,0.92);
            font-size: 0.95rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .modal-btn {
            min-height: 42px;
            padding: 0 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .modal-btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.14);
        }

        .modal-view {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background:
                radial-gradient(800px 500px at 50% 0%, rgba(110,168,242,0.10), transparent 58%),
                rgba(10, 16, 25, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 90px rgba(0,0,0,0.55);
            min-height: 0;
            display: grid;
            place-items: center;
        }

        .modal-view img {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 130px);
            object-fit: contain;
        }

        .modal-caption {
            padding: 12px 16px 16px;
            color: var(--muted);
            font-size: 0.94rem;
            text-align: center;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 980px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-copy {
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }

            .hero-image {
                min-height: 260px;
            }
        }

        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            nav { border-radius: 24px; padding: 0 14px; height: 64px; gap: 10px; }
            .logo { width: 40px; height: 40px; border-radius: 14px; }
            .site-title { font-size: 14px; min-width: 0; }
            .site-title small.site-subtitle {
                font-size: clamp(9px, 2.3vw, 11px);
                letter-spacing: -0.01em;
            }
            main { padding-top: 20px; }
            .hero-copy, .content, .media-wrap { padding-left: 18px; padding-right: 18px; }
            .media-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.15rem; }
            .hero-image { min-height: 240px; }
            .hero-image img { aspect-ratio: 16 / 10; }

            .media-card--clickable::after {
                content: "🔍";
                padding: 7px 9px;
            }

            .modal {
                padding: 10px;
            }

            .modal-view img {
                max-height: calc(100vh - 170px);
            }

            .modal-topbar {
                padding: 10px 12px;
                border-radius: 16px;
            }

            .modal-actions {
                gap: 8px;
            }

            .modal-btn {
                min-height: 40px;
                padding: 0 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="wrap">
            <nav class="glass">
                <div class="brand">
                    <div class="logo">
                        <img src="/assets/logo_strony.png" alt="Logo CyberProjects" />
                    </div>
                    <div class="site-title">
                        CyberProjects
                        <small class="site-subtitle">
                            <span>•</span>
                            <span>Sebastian Dziewit</span>
                            <span>•</span>
                        </small>
                    </div>
                </div>

                <a class="btn btn-back" href="javascript:history.back()">Powrót</a>
            </nav>
        </div>
    </div>

    <main>
        <div class="wrap">
            <article class="article-shell" id="articleRoot">
                <div class="error-box">Ładowanie artykułu...</div>
            </article>
        </div>
    </main>

    <div class="modal" id="imageModal" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia">
            <div class="modal-topbar">
                <div class="modal-title" id="modalTitle">Podgląd zdjęcia</div>
                <div class="modal-actions">
                    <button class="modal-btn" id="backToArticleBtn" type="button">Wróć do artykułu</button>
                    <button class="modal-btn" id="closeModalBtn" type="button" aria-label="Zamknij podgląd">Zamknij</button>
                </div>
            </div>
            <div class="modal-view">
                <img id="modalImage" src="" alt="" />
            </div>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function replaceExt(path, ext) {
            if (!path) return "";
            return String(path).replace(/\.[^./\\]+$/, "." + ext);
        }

        function unique(arr) {
            return [...new Set((arr || []).filter(Boolean))];
        }

        function arrayBufferToBase64(buffer) {
            let binary = "";
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;

            for (let i = 0; i < bytes.length; i += chunkSize) {
                const chunk = bytes.subarray(i, i + chunkSize);
                binary += String.fromCharCode.apply(null, chunk);
            }

            return btoa(binary);
        }

        function inlineFormat(text) {
            let out = escapeHtml(text);

            out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            out = out.replace(/(^|[^*])\*(?!\s)(.+?)(?<!\s)\*(?!\*)/g, "$1<em>$2</em>");
            out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
            out = out.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

            return out;
        }

        function formatTextToHtml(text) {
            const clean = String(text || "").replace(/\r/g, "").trim();
            if (!clean) return "<p>Brak treści artykułu.</p>";

            const lines = clean.split("\n");
            const blocks = [];
            let i = 0;

            while (i < lines.length) {
                const raw = lines[i];
                const line = raw.trim();

                if (!line) {
                    i++;
                    continue;
                }

                if (/^```/.test(line)) {
                    const codeLines = [];
                    i++;
                    while (i < lines.length && !/^```/.test(lines[i].trim())) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    if (i < lines.length) i++;
                    blocks.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
                    continue;
                }

                if (/^#{1,3}\s+/.test(line)) {
                    const level = Math.min(line.match(/^#{1,3}/)[0].length + 1, 4);
                    const title = line.replace(/^#{1,3}\s+/, "");
                    blocks.push(`<h${level}>${inlineFormat(title)}</h${level}>`);
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const quoteLines = [];
                    while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
                        quoteLines.push(lines[i].trim().replace(/^>\s?/, ""));
                        i++;
                    }
                    blocks.push(`<blockquote>${quoteLines.map(inlineFormat).join("<br>")}</blockquote>`);
                    continue;
                }

                if (/^(\-|\*|\d+\.)\s+/.test(line)) {
                    const isOrdered = /^\d+\.\s+/.test(line);
                    const items = [];
                    while (i < lines.length && /^(\-|\*|\d+\.)\s+/.test(lines[i].trim())) {
                        items.push(lines[i].trim().replace(/^(\-|\*|\d+\.)\s+/, ""));
                        i++;
                    }
                    const tag = isOrdered ? "ol" : "ul";
                    blocks.push(`<${tag}>${items.map(item => `<li>${inlineFormat(item)}</li>`).join("")}</${tag}>`);
                    continue;
                }

                const paraLines = [line];
                i++;
                while (i < lines.length) {
                    const next = lines[i].trim();
                    if (!next) break;
                    if (/^#{1,3}\s+/.test(next) || /^>\s?/.test(next) || /^(\-|\*|\d+\.)\s+/.test(next) || /^```/.test(next)) break;
                    paraLines.push(next);
                    i++;
                }

                blocks.push(`<p>${inlineFormat(paraLines.join(" "))}</p>`);
            }

            return blocks.join("");
        }

        function mediaFigureHtml(media, kind) {
            if (!media || !media.src) return "";
            const title = media.title ? escapeHtml(media.title) : "";
            const alt = title || "Grafika artykułu";

            if (kind === "video") {
                return `
                    <figure class="media-card">
                        <video controls preload="metadata">
                            <source src="${escapeHtml(media.src)}" type="video/mp4">
                            Twoja przeglądarka nie obsługuje odtwarzania wideo.
                        </video>
                        ${title ? `<figcaption>${title}</figcaption>` : ""}
                    </figure>
                `;
            }

            return `
                <button
                    type="button"
                    class="media-card media-card--clickable"
                    data-full="${escapeHtml(media.src)}"
                    data-title="${alt}"
                    data-caption="${title}"
                    aria-label="Otwórz zdjęcie w pełnym rozmiarze: ${alt}"
                >
                    <img src="${escapeHtml(media.src)}" alt="${alt}" loading="lazy" decoding="async">
                    ${title ? `<figcaption>${title}</figcaption>` : ""}
                </button>
            `;
        }

        function takeMax(items, maxCount) {
            return Array.isArray(items) ? items.slice(0, maxCount) : [];
        }

        function buildFileCandidates(article) {
            const docx = [];
            const txt = [];

            const addDocx = (p) => { if (p) docx.push(p); };
            const addTxt = (p) => { if (p) txt.push(p); };

            addDocx(article.docx);
            addTxt(article.txt);

            if (article.text) {
                const ext = (article.text.split(".").pop() || "").toLowerCase();
                if (ext === "docx") addDocx(article.text);
                else if (ext === "txt") addTxt(article.text);
                else {
                    addDocx(replaceExt(article.text, "docx"));
                    addTxt(replaceExt(article.text, "txt"));
                }
            }

            if (article.file) {
                const ext = (article.file.split(".").pop() || "").toLowerCase();
                if (ext === "docx") addDocx(article.file);
                else if (ext === "txt") addTxt(article.file);
                else {
                    addDocx(replaceExt(article.file, "docx"));
                    addTxt(replaceExt(article.file, "txt"));
                }
            }

            if (article.path) {
                const ext = (article.path.split(".").pop() || "").toLowerCase();
                if (ext === "docx") addDocx(article.path);
                else if (ext === "txt") addTxt(article.path);
                else {
                    addDocx(replaceExt(article.path, "docx"));
                    addTxt(replaceExt(article.path, "txt"));
                }
            }

            return {
                docx: unique(docx),
                txt: unique(txt)
            };
        }

        async function fetchTextIfExists(url) {
            try {
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) return null;
                return await res.text();
            } catch {
                return null;
            }
        }

        async function fetchArrayBufferIfExists(url) {
            try {
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) return null;
                return await res.arrayBuffer();
            } catch {
                return null;
            }
        }

        function mammothOptions() {
            return {
                convertImage: mammoth.images.inline(async (element) => {
                    const arrayBuffer = await element.read("arrayBuffer");
                    return {
                        src: `data:${element.contentType};base64,${arrayBufferToBase64(arrayBuffer)}`
                    };
                })
            };
        }

        async function loadDocxAsHtml(path) {
            const arrayBuffer = await fetchArrayBufferIfExists(path);
            if (!arrayBuffer) return null;

            try {
                const result = await mammoth.convertToHtml({ arrayBuffer }, mammothOptions());
                const html = (result.value || "").trim();
                return html || null;
            } catch (err) {
                console.warn("Nie udało się przekonwertować DOCX:", path, err);
                return null;
            }
        }

        async function resolveArticleHtml(article) {
            const { docx, txt } = buildFileCandidates(article);

            for (const path of docx) {
                const html = await loadDocxAsHtml(path);
                if (html) return { html, source: path, kind: "docx" };
            }

            for (const path of txt) {
                const text = await fetchTextIfExists(path);
                if (text !== null) return { html: formatTextToHtml(text), source: path, kind: "txt" };
            }

            if (article.content) {
                return { html: formatTextToHtml(article.content), source: "inline", kind: "inline" };
            }

            return { html: "<p>Brak treści artykułu.</p>", source: "", kind: "empty" };
        }

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        const modalTitle = document.getElementById("modalTitle");
        const modalCaption = document.getElementById("modalCaption");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const backToArticleBtn = document.getElementById("backToArticleBtn");
        let lastFocusedElement = null;

        function openModal(src, title, caption) {
            lastFocusedElement = document.activeElement;

            modalImg.src = src;
            modalImg.alt = title || "Powiększony obraz";
            modalTitle.textContent = title || "Podgląd zdjęcia";
            modalCaption.textContent = caption || "";

            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");

            closeModalBtn.focus();
        }

        function closeModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");

            modalImg.src = "";
            modalImg.alt = "";
            modalTitle.textContent = "Podgląd zdjęcia";
            modalCaption.textContent = "";

            if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
                lastFocusedElement.focus();
            }
        }

        closeModalBtn.addEventListener("click", closeModal);
        backToArticleBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("is-open")) {
                closeModal();
            }
        });

        async function loadArticle() {
            const root = document.getElementById("articleRoot");
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            try {
                const res = await fetch("articles.json", { cache: "no-store" });
                if (!res.ok) throw new Error("Nie znaleziono articles.json");

                const articles = await res.json();
                if (!Array.isArray(articles) || articles.length === 0) {
                    root.innerHTML = `<div class="error-box">Brak artykułów w pliku articles.json.</div>`;
                    return;
                }

                const article = articles.find((a, index) => String(a.id || index + 1) === String(id));
                if (!article) {
                    root.innerHTML = `<div class="error-box">Nie znaleziono artykułu o podanym identyfikatorze.</div>`;
                    return;
                }

                document.title = `${article.title || "Artykuł"} — CyberProjects`;

                const contentData = await resolveArticleHtml(article);

                const images = takeMax(article.images, 16);
                const videos = takeMax(article.videos, 4);

                const imageHtml = images.map((img) => mediaFigureHtml(img, "image")).join("");
                const videoHtml = videos.map((vid) => mediaFigureHtml(vid, "video")).join("");

                const mediaBlock = (imageHtml || videoHtml)
                    ? `
                        <div class="media-wrap">
                            <div class="divider"></div>
                            <h2 class="section-title">Materiały dodatkowe</h2>
                            ${imageHtml ? `<div class="media-grid">${imageHtml}</div>` : ""}
                            ${videoHtml ? `<div class="media-grid">${videoHtml}</div>` : ""}
                        </div>
                    `
                    : `
                        <div class="media-wrap">
                            <div class="divider"></div>
                            <div class="empty-state">Brak przypisanych grafik lub filmów.</div>
                        </div>
                    `;

                const cover = article.cover || (images[0] && images[0].src) || "";
                const coverTitle = article.title || "Artykuł";

                root.innerHTML = `
                    <div class="hero">
                        <div class="hero-copy">
                            <div class="kicker">
                                <span class="dot"></span>
                                <span>${escapeHtml(article.date || "Artykuł")}</span>
                                <span>•</span>
                                <span>${escapeHtml(article.category || "Technologia / Embedded")}</span>
                                ${contentData.kind === "docx" ? `<span>•</span><span>DOCX</span>` : ""}
                                ${contentData.kind === "txt" ? `<span>•</span><span>TXT</span>` : ""}
                            </div>

                            <h1>${escapeHtml(coverTitle)}</h1>

                            ${article.lead ? `<p class="lead">${escapeHtml(article.lead)}</p>` : ""}
                        </div>

                        <div class="hero-image">
                            ${
                                cover
                                    ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(coverTitle)}" loading="eager" decoding="async">`
                                    : `<div class="hero-placeholder">Brak grafiki wyróżniającej</div>`
                            }
                        </div>
                    </div>

                    <div class="content">
                        <div class="article-content">${contentData.html}</div>
                    </div>

                    ${mediaBlock}
                `;

                root.querySelectorAll(".media-card--clickable").forEach((card) => {
                    card.addEventListener("click", () => {
                        openModal(
                            card.getAttribute("data-full") || "",
                            card.getAttribute("data-title") || "Podgląd zdjęcia",
                            card.getAttribute("data-caption") || ""
                        );
                    });
                });
            } catch (err) {
                console.error(err);
                root.innerHTML = `
                    <div class="error-box">
                        <strong>Nie udało się wczytać artykułu.</strong><br>
                        Sprawdź plik <code>articles.json</code> oraz ścieżki do plików <code>.docx</code> i <code>.txt</code>.
                    </div>
                `;
            }
        }

        loadArticle();
    </script>
</body>
</html>
